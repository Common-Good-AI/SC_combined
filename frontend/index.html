<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoVocal Admin Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>GoVocal Admin Dashboard</h1>
    </header>

    <nav class="tabs">
      <button
        :class="['tab-btn', { active: activeTab === 'participation' }]"
        @click="activeTab = 'participation'"
      >Participation</button>
      <button
        :class="['tab-btn', { active: activeTab === 'ideas' }]"
        @click="activeTab = 'ideas'"
      >Ideas</button>
    </nav>

    <main class="content">
      <participation-tab v-if="activeTab === 'participation'"></participation-tab>
      <ideas-tab v-if="activeTab === 'ideas'"></ideas-tab>
    </main>
  </div>

  <!-- Components (order matters: leaf components first) -->
  <script src="/static/js/components/IdeaDetail.js"></script>
  <script src="/static/js/components/ParticipationTab.js"></script>
  <script src="/static/js/components/IdeasTab.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
