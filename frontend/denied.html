<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied · The South Carolina Forum Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="https://use.typekit.net/sze3jop.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <img class="auth-logo" src="/static/logo.svg" alt="GoVocal logo" />
      <h1 class="auth-title">Access Denied</h1>
      <p class="auth-subtitle">Your Google account is not authorised to access this dashboard.</p>
      <p class="auth-note">If you believe this is an error, contact your administrator to have your email added to the allow list.</p>
      <a href="/login/google" class="google-btn google-btn--secondary">Try another account</a>
    </div>
  </div>
</body>
</html>
